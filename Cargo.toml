[package]
name = "contiguous-tree"
version = "0.1.0"
edition = "2024"
description = "Contiguous postorder trees with typed schemas, cursors, and rewriting"
repository = "https://github.com/INTO-CPS-Association/contiguous-tree"
readme = "README.md"
license-file = "LICENSE.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE.md", "COPYING", "ICA-USAGE-MODE.txt"]

[workspace]
members = ["macros"]
resolver = "3"

[lib]
name = "contiguous_tree"
path = "src/lib.rs"

[features]
default = []
thread-safe = []
serde = ["dep:serde", "contiguous-tree-macros/serde"]

[dependencies]
contiguous-tree-macros = { version = "=0.1.0", path = "macros" }
serde = { version = "1.0.229", optional = true }

[dev-dependencies]
ecow = "0.3.0"
proptest = "1.11.0"
serde_json = "1.0.151"
